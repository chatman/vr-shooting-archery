<!doctype html>
<meta charset="utf-8">
<title>vrshooting - 3D world viewer</title>
<script type="module" src="lib/model-viewer.min.js"></script>
<style>
  :root { color-scheme: dark; }
  body { margin:0; font:14px/1.5 system-ui,sans-serif; background:#111; color:#eee;
         display:flex; flex-direction:column; height:100vh; }
  header { padding:10px 14px; background:#1b1b1b; border-bottom:1px solid #333;
           display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
  select { background:#222; color:#eee; border:1px solid #444; padding:6px; font-size:14px;
           max-width:60vw; }
  #note { color:#9aa; }
  model-viewer { flex:1; width:100%; background:#0d0d0d; }
  #bar { height:3px; background:#2a7; width:0; transition:width .2s; }
  kbd { background:#222; border:1px solid #444; border-radius:3px; padding:1px 5px; }
</style>

<header>
  <strong>3D world viewer</strong>
  <select id="pick"><option value="/output/range_10m/range_10m.glb" data-note="40 lanes, 42 m x 30 m x 6 m, glazed front wall; every dimension exact">Specified 10 m hall - built to a brief (game-ready) - 1 MB</option>
    <option value="/output/kalyani_world/range_symmetric.glb" data-note="Full relief, bench de-warped so the shooting points align">Kalyani 10 m range - firing line straightened - 138 MB</option>
    <option value="/output/kalyani_world/range_solid.glb" data-note="Plane-fitted room + firing counter, 22 triangles, continuous floor">Kalyani 10 m range - solid (game-ready) - 1 MB</option>
    <option value="/output/kalyani_world/range_main.glb" data-note="MoGe-2 metric mono from the 4096x3072 photo; target wall at 12.1 m">Kalyani 10 m range - main - 138 MB</option>
    <option value="/output/kalyani_world/range_alt.glb" data-note="MoGe-2 metric mono from the second photo; target wall at 11.7 m">Kalyani 10 m range - second angle - 83 MB</option>
    <option value="/output/bhopal_world/hall_view1.glb" data-note="DA3 metric mono; ~20 m of hall, real-world scale">Bhopal 10 m hall - down the firing line - 28 MB</option>
    <option value="/output/bhopal_world/hall_view2.glb" data-note="DA3 metric mono; ~16 m of hall, real-world scale">Bhopal 10 m hall - elevated along the line - 34 MB</option>
    <option value="/output/karni_world/world_merged.glb" data-note="5 photo views fused by DA3 multiview">Karni Singh 10 m hall - merged world - 128 MB</option>
    <option value="/output/world_closed_shell.glb" data-note="text -> panorama -> MoGe, no culling">Generated range - closed shell - 47 MB</option>
    <option value="/output/world_culled.glb" data-note="text -> panorama -> MoGe, discontinuities dropped">Generated range - culled - 45 MB</option>
    <option value="/output/karni_world/views/view00_00001_.glb" data-note="">view00_00001_ - 23 MB</option>
    <option value="/output/karni_world/views/view01_00001_.glb" data-note="">view01_00001_ - 22 MB</option>
    <option value="/output/karni_world/views/view02_00001_.glb" data-note="">view02_00001_ - 21 MB</option>
    <option value="/output/karni_world/views/view03_00001_.glb" data-note="">view03_00001_ - 3 MB</option>
    <option value="/output/karni_world/views/view04_00001_.glb" data-note="">view04_00001_ - 5 MB</option>
    <option value="/output/karni_world/views/view05_00001_.glb" data-note="">view05_00001_ - 2 MB</option>
    <option value="/output/karni_world/views/view06_00001_.glb" data-note="">view06_00001_ - 2 MB</option>
    <option value="/output/karni_world/views/view07_00001_.glb" data-note="">view07_00001_ - 27 MB</option>
    <option value="/output/karni_world/views/view08_00001_.glb" data-note="">view08_00001_ - 35 MB</option>
    <option value="/output/karni_world/views/view09_00001_.glb" data-note="">view09_00001_ - 2 MB</option></select>
  <span id="note"></span>
  <span style="margin-left:auto; color:#888">
    drag = orbit &middot; <kbd>scroll</kbd> = zoom &middot; two-finger / right-drag = pan
  </span>
</header>
<div id="bar"></div>
<model-viewer id="mv" camera-controls interaction-prompt="none"
              exposure="1.0" shadow-intensity="0" min-field-of-view="5deg"
              max-camera-orbit="Infinity 180deg Infinity" style="--poster-color:transparent">
</model-viewer>

<script>
  const pick = document.getElementById('pick');
  const mv   = document.getElementById('mv');
  const bar  = document.getElementById('bar');
  const note = document.getElementById('note');

  function load() {
    const opt = pick.selectedOptions[0];
    note.textContent = opt.dataset.note || '';
    bar.style.width = '0%';
    mv.src = opt.value;
  }
  mv.addEventListener('progress', e => {
    bar.style.width = (e.detail.totalProgress * 100).toFixed(0) + '%';
  });
  mv.addEventListener('load', () => {
    bar.style.width = '100%';
    // Frame the model from a slight elevation rather than dead-on.
    mv.cameraOrbit = '15deg 72deg auto';
    setTimeout(() => bar.style.width = '0%', 600);
  });
  pick.addEventListener('change', load);
  load();
</script>
